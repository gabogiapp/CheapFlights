name: Flight Deal Tracker

on:
  schedule:
    # Run hourly at 15 minutes past the hour
    - cron: '15 * * * *'
    # Optional Burst Schedule for Travel Deal Tuesday (December 1, 2026):
    # To run every 15 minutes during Deal Tuesday, uncomment the following line:
    # - cron: '*/15 * 1 12 *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry Run mode (logs deals to stdout without sending webhook alerts)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  track-flights:
    name: Scan Fares & Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flight deal orchestrator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python -m src.tracker

      - name: Commit and push updated deal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_deals.json data/price_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(tracker): update seen deals and price history [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
